AWSTemplateFormatVersion: "2010-09-09"
Description: Vocabulary Builder MVP - Cognito User Pool (Hosted UI, Email+Password, PKCE, no Identity Pool)

Parameters:
  CognitoDomainPrefix:
    Type: String
    Description: Unique domain prefix for Cognito Hosted UI (must be globally unique in the region)
    MinLength: 1
    MaxLength: 63

  CallbackURL:
    Type: String
    Description: OAuth2 callback URL for the SPA (e.g., https://<cloudfront-domain>/callback)
    MinLength: 1

  LogoutURL:
    Type: String
    Description: OAuth2 logout redirect URL for the SPA (e.g., https://<cloudfront-domain>/)
    MinLength: 1

Resources:
  VocabularyBuilderUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: vb-user-pool-2025
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: "OFF"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      UserPoolAddOns:
        AdvancedSecurityMode: "OFF"

  VocabularyBuilderUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref VocabularyBuilderUserPool
      ClientName: vb-spa-client-2025
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
      CallbackURLs:
        - !Ref CallbackURL
      LogoutURLs:
        - !Ref LogoutURL
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  VocabularyBuilderUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref VocabularyBuilderUserPool

Outputs:
  UserPoolId:
    Value: !Ref VocabularyBuilderUserPool

  UserPoolClientId:
    Value: !Ref VocabularyBuilderUserPoolClient

  HostedUIDomain:
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"

  HostedUILoginURLBase:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/login"

  HostedUILogoutURLBase:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/logout"
